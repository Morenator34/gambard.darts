<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#c62828">

<!-- =====================================================
     ICÔNE DE L'APPLICATION
===================================================== -->

<link
  rel="apple-touch-icon"
  href="gambard-icon.png"
>

<link
  rel="icon"
  type="image/png"
  href="gambard-icon.png"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<meta
  name="apple-mobile-web-app-title"
  content="Gambard Darts"
>

<title>Gambard Darts 🎯</title>


<style>

/* =====================================================
   VARIABLES
===================================================== */

:root{
  --red:#d62828;
  --red-dark:#941818;
  --red-light:#ff4b4b;
  --green:#159447;
  --cream:#e8dfca;
  --panel:rgba(35,35,35,.76);
  --text:#fff;
  --muted:#d0d0d0;
  --ok:#49d88b;
}


/* =====================================================
   BASE
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:var(--text);
}

body{
  min-height:100vh;
  overflow-x:hidden;
  background:#262626;
}


/* =====================================================
   WALLPAPER
===================================================== */

.background{
  position:fixed;
  inset:0;
  z-index:-3;

  background-image:url("wallpaper.jpg.jpeg");

  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
}

.background-overlay{
  position:fixed;
  inset:0;
  z-index:-2;

  background:
    linear-gradient(
      135deg,
      rgba(0,0,0,.38),
      rgba(20,20,20,.55)
    );
}

.background-blur{
  position:fixed;
  inset:-20px;
  z-index:-1;

  backdrop-filter:blur(1px);
  -webkit-backdrop-filter:blur(1px);

  pointer-events:none;
}


/* =====================================================
   APPLICATION
===================================================== */

.app{
  width:min(1100px,100%);
  margin:auto;

  padding:
    14px
    12px
    30px;
}


/* =====================================================
   TITRE
===================================================== */

header{
  text-align:center;

  padding:
    8px
    0
    15px;
}

h1{
  margin:0;

  font-size:
    clamp(34px,7vw,60px);

  font-weight:900;

  letter-spacing:1px;

  text-shadow:
    0 4px 15px #000,
    0 2px 3px #000;
}

.subtitle{
  margin-top:4px;

  color:#f0f0f0;

  font-size:13px;

  text-shadow:
    0 2px 6px #000;
}


/* =====================================================
   PANNEAUX
===================================================== */

.panel{
  background:
    var(--panel);

  border:
    1px solid
    rgba(255,255,255,.18);

  border-radius:18px;

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.45);

  padding:14px;

  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}


/* =====================================================
   CONFIGURATION
===================================================== */

.setup-grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;
}

label{
  display:block;

  font-size:12px;

  color:var(--muted);

  margin:
    0
    0
    5px
    3px;
}

input,
select,
button{
  font:inherit;

  border:0;

  border-radius:12px;
}

input,
select{
  width:100%;

  padding:12px;

  background:
    rgba(255,255,255,.95);

  color:#111;
}

button{
  padding:
    12px
    14px;

  background:#fff;

  color:#111;

  font-weight:800;

  cursor:pointer;

  touch-action:manipulation;

  transition:
    transform .08s,
    filter .15s;
}

button:hover{
  filter:brightness(1.08);
}

button:active{
  transform:scale(.97);
}

button.primary{
  background:
    linear-gradient(
      135deg,
      var(--red-light),
      var(--red)
    );

  color:#fff;

  box-shadow:
    0 5px 16px
    rgba(214,40,40,.30);
}

button.dark{
  background:#3b3b3b;
  color:#fff;
}

button.danger{
  background:
    linear-gradient(
      135deg,
      #e53935,
      #9e1b1b
    );

  color:#fff;
}

button.ok{
  background:var(--ok);
  color:#111;
}


/* =====================================================
   JOUEURS
===================================================== */

.players{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:10px;

  margin-top:10px;
}

.player-card{
  padding:12px;

  border-radius:15px;

  background:
    rgba(20,20,20,.68);

  border:
    2px solid
    transparent;

  box-shadow:
    0 7px 20px
    rgba(0,0,0,.25);
}

.player-card.active{
  border-color:
    var(--red-light);

  box-shadow:
    0 0 22px
    rgba(214,40,40,.35);
}

.player-name{
  font-weight:900;
  font-size:18px;
}

.player-score{
  font-size:34px;
  font-weight:900;

  margin-top:2px;
}


/* =====================================================
   TOUR
===================================================== */

.turn-info{
  text-align:center;

  margin:12px 0;

  font-weight:800;

  text-shadow:
    0 2px 5px #000;
}

.turn-info span{
  color:#ff5555;
}


/* =====================================================
   ZONE DE JEU
===================================================== */

.game{
  display:grid;

  grid-template-columns:
    minmax(300px,1fr)
    minmax(280px,390px);

  gap:14px;

  align-items:start;

  margin-top:14px;
}

.board-panel{
  display:flex;

  flex-direction:column;

  align-items:center;
}


/* =====================================================
   CIBLE
===================================================== */

.board-wrap{
  width:min(86vw,620px);
  max-width:620px;

  aspect-ratio:1;
}

svg{
  width:100%;
  height:100%;

  display:block;

  filter:
    drop-shadow(
      0 12px 18px
      rgba(0,0,0,.65)
    );

  touch-action:manipulation;
}

.board-zone{
  cursor:pointer;
}


/* =====================================================
   COMMANDES
===================================================== */

.controls{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

  margin-top:12px;

  width:100%;
}

.controls button:first-child{
  grid-column:
    1 / -1;
}


/* =====================================================
   DARTS
===================================================== */

.dart-list{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

  margin-top:10px;
}

.dart{
  background:
    rgba(255,255,255,.09);

  border:
    1px solid
    rgba(255,255,255,.14);

  border-radius:12px;

  padding:10px 5px;

  text-align:center;
}

.dart small{
  display:block;
  color:#aaa;
}

.dart strong{
  font-size:18px;
}


/* =====================================================
   HISTORIQUE
===================================================== */

.history{
  margin-top:10px;

  max-height:180px;

  overflow:auto;

  font-size:13px;
}

.history-row{
  display:flex;

  justify-content:space-between;

  gap:10px;

  padding:7px 3px;

  border-bottom:
    1px solid
    rgba(255,255,255,.10);
}


/* =====================================================
   MESSAGE
===================================================== */

.message{
  margin-top:10px;

  padding:
    10px
    12px;

  border-radius:12px;

  text-align:center;

  background:
    rgba(255,255,255,.08);

  font-weight:800;

  min-height:40px;
}

.small-actions{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

  margin-top:10px;
}


/* =====================================================
   VICTOIRE
===================================================== */

.modal{
  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.74);

  display:none;

  align-items:center;

  justify-content:center;

  padding:18px;

  z-index:20;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(500px,100%);

  background:
    rgba(30,30,30,.97);

  border:
    1px solid
    #555;

  border-radius:20px;

  padding:24px;

  text-align:center;

  box-shadow:
    0 20px 60px
    #000;
}

.modal-box h2{
  margin:
    0
    0
    12px;

  font-size:30px;
}

#winnerText{
  color:#fff;

  font-size:
    clamp(20px,4vw,27px);

  line-height:1.35;

  font-weight:900;

  margin:
    10px
    0
    18px;
}

.modal-box button{
  width:100%;
  margin-top:8px;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
  text-align:center;

  color:#ddd;

  font-size:11px;

  margin-top:12px;

  text-shadow:
    0 2px 5px
    #000;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:760px){

  .game{
    grid-template-columns:1fr;
  }

  .board-wrap{
    width:min(94vw,560px);
  }
}


@media(max-width:430px){

  .app{
    padding:
      8px
      8px
      22px;
  }

  .setup-grid{
    grid-template-columns:1fr;
  }

  .players{
    grid-template-columns:
      1fr 1fr;
  }

  .player-name{
    font-size:15px;
  }

  .player-score{
    font-size:28px;
  }

  h1{
    font-size:36px;
  }

  .modal-box{
    padding:20px 16px;
  }

  #winnerText{
    font-size:21px;
  }
}

</style>

</head>


<body>


<!-- =====================================================
     FOND
===================================================== -->

<div class="background"></div>

<div class="background-overlay"></div>

<div class="background-blur"></div>


<div class="app">


<!-- =====================================================
     TITRE
===================================================== -->

<header>

  <h1>
    Gambard Darts 🎯
  </h1>

  <div class="subtitle">
    Compteur de fléchettes • 301 / 501 / 701
  </div>

</header>


<!-- =====================================================
     CONFIGURATION
===================================================== -->

<section class="panel">

  <div class="setup-grid">

    <div>

      <label for="p1">
        Joueur 1
      </label>

      <input
        id="p1"
        value="Joueur 1"
        maxlength="18"
      >

    </div>


    <div>

      <label for="p2">
        Joueur 2
      </label>

      <input
        id="p2"
        value="Joueur 2"
        maxlength="18"
      >

    </div>


    <div>

      <label for="startScore">
        Départ
      </label>

      <select id="startScore">

        <option value="301">
          301
        </option>

        <option value="501" selected>
          501
        </option>

        <option value="701">
          701
        </option>

      </select>

    </div>


    <div
      style="
        display:flex;
        align-items:end;
      "
    >

      <button
        class="primary"
        style="width:100%"
        onclick="newGame()"
      >
        Nouvelle partie
      </button>

    </div>

  </div>

</section>


<!-- =====================================================
     JOUEURS
===================================================== -->

<section
  class="players"
  id="players">
</section>


<!-- =====================================================
     TOUR
===================================================== -->

<div class="turn-info">

  Tour de

  <span id="activeName">
    Joueur 1
  </span>

  • Fléchette

  <span id="dartNumber">
    1
  </span>

  /3

</div>


<!-- =====================================================
     JEU
===================================================== -->

<section class="game">


<!-- =====================================================
     CIBLE
===================================================== -->

<div class="panel board-panel">

  <div class="board-wrap">

    <svg
      id="board"
      viewBox="-280 -280 560 560"
      aria-label="Cible de fléchettes"
    ></svg>

  </div>


  <div class="controls">

    <button
      class="dark"
      onclick="addMiss()"
    >
      MISS / 0
    </button>


    <button
      class="danger"
      onclick="bust()"
    >
      BUST
    </button>


    <button
      class="dark"
      onclick="undo()"
    >
      ↶ Annuler
    </button>

  </div>

</div>


<!-- =====================================================
     PANNEAU TOUR
===================================================== -->

<aside class="panel">

  <div
    style="
      font-weight:900;
      font-size:20px;
    "
  >
    Tour en cours
  </div>


  <div
    class="dart-list"
    id="dartList"
  ></div>


  <div
    class="message"
    id="message"
  >
    Clique sur une zone de la cible.
  </div>


  <div class="small-actions">

    <button
      class="ok"
      onclick="endTurn()"
    >
      Fin du tour
    </button>


    <button
      class="dark"
      onclick="newGame()"
    >
      Recommencer
    </button>

  </div>


  <div
    style="
      font-weight:900;
      margin-top:14px;
    "
  >
    Historique
  </div>


  <div
    class="history"
    id="history"
  ></div>

</aside>

</section>


<footer>

  Gambard Darts 🎯
  —
  BUST = retour au score du début du tour.

</footer>

</div>


<!-- =====================================================
     FENÊTRE VICTOIRE
===================================================== -->

<div
  class="modal"
  id="winModal"
>

  <div class="modal-box">

    <h2>
      🎯 VICTOIRE !
    </h2>

    <p id="winnerText"></p>


    <button
      class="primary"
      onclick="closeWin();newGame()"
    >
      Nouvelle partie
    </button>


    <button
      class="dark"
      onclick="closeWin()"
    >
      Fermer
    </button>

  </div>

</div>


<script>


/* =====================================================
   ORDRE TRADITIONNEL DE LA CIBLE
===================================================== */

const nums = [

  20, 1, 18, 4, 13,
  6, 10, 15, 2, 17,
  3, 19, 7, 16, 8,
  11, 14, 9, 12, 5

];


const NS =
  "http://www.w3.org/2000/svg";


/* =====================================================
   PHRASES DE VICTOIRE
===================================================== */

const victoryMessages = [

  "👨🏻‍🏫 {winner} vient d’apprendre le jeu à {loser} !",

  "🔥 Quel finish, victoire de {winner} !",

  "🎯 Dans le mille, c’est gagné pour {winner} !",

  "😎 Tout en maîtrise pour {winner} qui s’impose sans trembler !",

  "💸 Désolé {loser} mais le haut niveau, ça paye cash !",

  "🏆 Le patron a encore frappé, bravo {winner} !",

  "🤷‍♂️ Why always {winner} ?",

  "📐 {loser}, la cible c'est le rond au milieu, pas le mur derrière !",

  "🐐 Le GOAT, c’est {winner} !",

  "😂 {loser}, tu croyais vraiment pouvoir gagner ?",

  "⚡️ Précision et habileté, c’est signé {winner} !",

  "🥶 Quel sang froid de la part de {winner} !",

  "💼 Une journée classique au boulot pour {winner} !",

  "👓 {loser}, un rdv chez l'ophtalmo est déjà réservé !",

  "🧱 {winner} a fini la partie, {loser} cherche encore ses fléchettes dans le placo !",

  "🙈 {winner} a gagné en fermant les yeux, quelle est ton excuse {loser} ?",

  "🎯 {winner} joue aux fléchettes, {loser} fait de la peinture sur le mur !",

  "🫪 On dirait que {loser} n’a pas les yeux en face des trous !",

  "🤮 Un niveau de jeu pareil {loser}, ça devrait être interdit par la loi…",

  "🤡 {loser}, range tes fléchettes et va acheter des boules de pétanque !",

  "👆 C’est pas grave {loser}, vaut mieux perdre 1 fois 301-0 que 301 fois 1-0",

  "🪦 {loser} est venu, a vu, et s'est fait piétiner sans l'ombre d'un respect !",

  "🩸 {winner} vient de massacrer {loser}, ramassez les morceaux !",

  "❌ Ce que vient de faire {loser}, c’est tout ce qu’on ne veut pas voir dans le monde des fléchettes !",

  "🚀 Thomas Pesquet vient de recevoir les fléchettes de {loser} !",

  "🧑🏻‍🦯‍➡️ Belle victoire de {winner} face à Gilbert Montagné !",

  "🏝️ {loser}, les autres joueurs ont décidé de t'éliminer, et leur sentence est irrévocable…",

  "🥊 {winner} a mis K.O. {loser} !",

  "Allez à la niche {loser} !",

  "👶🏼 Désolé {loser} mais même Noé aurait fait un meilleur score que toi !"

];


/* =====================================================
   ÉTAT DU JEU
===================================================== */

let state = {

  players:[],

  active:0,

  startScore:501,

  turnStartScore:501,

  darts:[],

  history:[],

  gameOver:false

};


/* =====================================================
   ELEMENT
===================================================== */

function el(id){

  return document.getElementById(id);

}


/* =====================================================
   COORDONNÉES POLAIRES
===================================================== */

function polar(r,angle){

  const rad =
    (angle - 90) *
    Math.PI /
    180;

  return [

    r * Math.cos(rad),

    r * Math.sin(rad)

  ];

}


/* =====================================================
   CRÉATION D'UN SECTEUR
===================================================== */

function sectorPath(
  r1,
  r2,
  a1,
  a2
){

  const outer1 =
    polar(r2,a1);

  const outer2 =
    polar(r2,a2);

  const inner1 =
    polar(r1,a1);

  const inner2 =
    polar(r1,a2);


  return `

    M
      ${outer1[0]}
      ${outer1[1]}

    A
      ${r2}
      ${r2}
      0 0 1
      ${outer2[0]}
      ${outer2[1]}

    L
      ${inner2[0]}
      ${inner2[1]}

    A
      ${r1}
      ${r1}
      0 0 0
      ${inner1[0]}
      ${inner1[1]}

    Z

  `;

}


/* =====================================================
   ÉLÉMENT SVG
===================================================== */

function svgEl(
  tag,
  attrs={}
){

  const x =
    document.createElementNS(
      NS,
      tag
    );

  Object.entries(attrs)
    .forEach(
      ([key,value]) =>
        x.setAttribute(
          key,
          value
        )
    );

  return x;

}


/* =====================================================
   DESSIN DE LA CIBLE
===================================================== */

function drawBoard(){

  const svg =
    el("board");

  svg.innerHTML="";


  /* ===================================================
     CERCLE EXTÉRIEUR
  =================================================== */

  svg.appendChild(

    svgEl(
      "circle",
      {
        cx:0,
        cy:0,
        r:268,
        fill:"#111",
        stroke:"#aaa",
        "stroke-width":5
      }
    )

  );


  /*
     DIMENSIONS :

     Bullseye       0 → 16
     Bull           16 → 32
     Simple         32 → 96
     TRIPLE         96 → 116
     Simple         116 → 218
     DOUBLE         218 → 248
     Bord            248 → 255
  */


  for(
    let i=0;
    i<20;
    i++
  ){

    const number =
      nums[i];

    const a1 =
      i * 18 - 9;

    const a2 =
      i * 18 + 9;

    const isBlack =
      i % 2 === 0;


    const normalColor =
      isBlack
        ? "#151515"
        : "#e8dfca";


    const ringColor =
      isBlack
        ? "#c62828"
        : "#159447";


    /* =================================================
       SIMPLE INTÉRIEUR
    ================================================= */

    const simpleInner =
      svgEl(
        "path",
        {
          d:
            sectorPath(
              32,
              96,
              a1,
              a2
            ),

          fill:
            normalColor,

          stroke:"#444",

          "stroke-width":1,

          class:"board-zone"
        }
      );


    simpleInner.addEventListener(
      "click",
      function(e){

        e.stopPropagation();

        score(
          number,
          1,
          "Simple"
        );

      }
    );


    svg.appendChild(
      simpleInner
    );


    /* =================================================
       TRIPLE — AGRANDI
    ================================================= */

    const triple =
      svgEl(
        "path",
        {
          d:
            sectorPath(
              96,
              116,
              a1,
              a2
            ),

          fill:
            ringColor,

          stroke:"#111",

          "stroke-width":2,

          class:"board-zone"
        }
      );


    triple.addEventListener(
      "click",
      function(e){

        e.stopPropagation();

        score(
          number,
          3,
          "Triple"
        );

      }
    );


    svg.appendChild(
      triple
    );


    /* =================================================
       SIMPLE EXTÉRIEUR
    ================================================= */

    const simpleOuter =
      svgEl(
        "path",
        {
          d:
            sectorPath(
              116,
              218,
              a1,
              a2
            ),

          fill:
            normalColor,

          stroke:"#444",

          "stroke-width":1,

          class:"board-zone"
        }
      );


    simpleOuter.addEventListener(
      "click",
      function(e){

        e.stopPropagation();

        score(
          number,
          1,
          "Simple"
        );

      }
    );


    svg.appendChild(
      simpleOuter
    );


    /* =================================================
       DOUBLE — AGRANDI
    ================================================= */

    const double =
      svgEl(
        "path",
        {
          d:
            sectorPath(
              218,
              248,
              a1,
              a2
            ),

          fill:
            ringColor,

          stroke:"#111",

          "stroke-width":2,

          class:"board-zone"
        }
      );


    double.addEventListener(
      "click",
      function(e){

        e.stopPropagation();

        score(
          number,
          2,
          "Double"
        );

      }
    );


    svg.appendChild(
      double
    );


    /* =================================================
       BORD EXTÉRIEUR
    ================================================= */

    const outer =
      svgEl(
        "path",
        {
          d:
            sectorPath(
              248,
              255,
              a1,
              a2
            ),

          fill:
            "#222",

          stroke:"#777",

          "stroke-width":1,

          class:"board-zone"
        }
      );


    outer.addEventListener(
      "click",
      function(e){

        e.stopPropagation();

        score(
          number,
          1,
          "Simple"
        );

      }
    );


    svg.appendChild(
      outer
    );

  }


  /* ===================================================
     ANNEAUX
  =================================================== */

  [

    32,
    96,
    116,
    218,
    248,
    255

  ].forEach(

    function(r){

      svg.appendChild(

        svgEl(
          "circle",
          {
            cx:0,
            cy:0,
            r:r,
            fill:"none",
            stroke:"#777",
            "stroke-width":1.5,
            "pointer-events":"none"
          }
        )

      );

    }

  );


  /* ===================================================
     LIGNES
  =================================================== */

  for(
    let i=0;
    i<20;
    i++
  ){

    const angle =
      i * 18 - 9;


    const p1 =
      polar(
        32,
        angle
      );


    const p2 =
      polar(
        255,
        angle
      );


    svg.appendChild(

      svgEl(
        "line",
        {
          x1:p1[0],
          y1:p1[1],

          x2:p2[0],
          y2:p2[1],

          stroke:"#555",

          "stroke-width":1,

          "pointer-events":"none"
        }
      )

    );

  }


  /* ===================================================
     BULL
  =================================================== */

  const bull =
    svgEl(
      "circle",
      {
        cx:0,
        cy:0,
        r:32,

        fill:"#159447",

        stroke:"#111",

        "stroke-width":2,

        class:"board-zone"
      }
    );


  bull.addEventListener(
    "click",
    function(e){

      e.stopPropagation();

      score(
        25,
        1,
        "Bull"
      );

    }
  );


  svg.appendChild(
    bull
  );


  /* ===================================================
     BULLSEYE
  =================================================== */

  const bullseye =
    svgEl(
      "circle",
      {
        cx:0,
        cy:0,
        r:16,

        fill:"#c62828",

        stroke:"#111",

        "stroke-width":2,

        class:"board-zone"
      }
    );


  bullseye.addEventListener(
    "click",
    function(e){

      e.stopPropagation();

      score(
        50,
        1,
        "Bullseye"
      );

    }
  );


  svg.appendChild(
    bullseye
  );


  /* ===================================================
     NUMÉROS
  =================================================== */

  for(
    let i=0;
    i<20;
    i++
  ){

    const angle =
      i * 18;


    const p =
      polar(
        264,
        angle
      );


    const text =
      svgEl(
        "text",
        {
          x:p[0],

          y:p[1] + 8,

          "text-anchor":
            "middle",

          fill:"#fff",

          "font-size":"22",

          "font-weight":"900",

          "paint-order":
            "stroke",

          stroke:"#000",

          "stroke-width":"4",

          "pointer-events":
            "none"
        }
      );


    text.textContent =
      nums[i];


    svg.appendChild(
      text
    );

  }

}


/* =====================================================
   NOUVELLE PARTIE
===================================================== */

function newGame(){

  const name1 =
    el("p1")
      .value
      .trim()
    ||
    "Joueur 1";


  const name2 =
    el("p2")
      .value
      .trim()
    ||
    "Joueur 2";


  const start =
    Number(
      el("startScore").value
    );


  state = {

    players:[

      {
        name:name1,
        score:start
      },

      {
        name:name2,
        score:start
      }

    ],

    active:0,

    startScore:start,

    turnStartScore:start,

    darts:[],

    history:[],

    gameOver:false

  };


  el("message")
    .textContent =
      "Clique sur une zone de la cible.";


  closeWin();

  render();

}


/* =====================================================
   AFFICHAGE
===================================================== */

function render(){

  el("players")
    .innerHTML =

      state.players
        .map(
          function(player,index){

            return `

              <div
                class="
                  player-card
                  ${
                    index === state.active &&
                    !state.gameOver
                      ? "active"
                      : ""
                  }
                "
              >

                <div class="player-name">

                  ${escapeHtml(
                    player.name
                  )}

                </div>

                <div class="player-score">

                  ${player.score}

                </div>

              </div>

            `;

          }
        )
        .join("");


  el("activeName")
    .textContent =
      state.players[
        state.active
      ]?.name || "";


  el("dartNumber")
    .textContent =

      Math.min(
        state.darts.length + 1,
        3
      );


  if(
    state.darts.length > 0
  ){

    el("dartList")
      .innerHTML =

        state.darts
          .map(
            function(dart,index){

              return `

                <div class="dart">

                  <small>
                    Dart ${index + 1}
                  </small>

                  <strong>
                    ${escapeHtml(
                      dart.label
                    )}
                  </strong>

                </div>

              `;

            }
          )
          .join("");

  }else{

    el("dartList")
      .innerHTML = `

        <div
          class="dart"
          style="grid-column:1/-1"
        >

          <small>
            Prêt
          </small>

          <strong>
            —
          </strong>

        </div>

      `;

  }


  if(
    state.history.length > 0
  ){

    el("history")
      .innerHTML =

        state.history
          .slice()
          .reverse()
          .map(
            function(item){

              return `

                <div class="history-row">

                  <span>
                    ${escapeHtml(
                      item.player
                    )}
                  </span>

                  <strong>
                    ${escapeHtml(
                      item.text
                    )}
                  </strong>

                </div>

              `;

            }
          )
          .join("");

  }else{

    el("history")
      .innerHTML = `

        <div
          style="
            color:#aaa;
            padding:8px 0;
          "
        >
          Aucun tour joué.
        </div>

      `;

  }

}


/* =====================================================
   PROTECTION HTML
===================================================== */

function escapeHtml(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      function(char){

        return {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        }[char];

      }
    );

}


/* =====================================================
   MESSAGE DE VICTOIRE ALÉATOIRE
===================================================== */

function getVictoryMessage(
  winner,
  loser
){

  const randomIndex =
    Math.floor(
      Math.random() *
      victoryMessages.length
    );


  return victoryMessages[
    randomIndex
  ]

    .replace(
      /\{winner\}/g,
      escapeHtml(winner)
    )

    .replace(
      /\{loser\}/g,
      escapeHtml(loser)
    );

}


/* =====================================================
   SCORE
===================================================== */

function score(
  base,
  multiplier,
  type
){

  if(
    state.gameOver
  ){
    return;
  }


  if(
    state.darts.length >= 3
  ){
    return;
  }


  const player =
    state.players[
      state.active
    ];


  const value =
    base * multiplier;


  const newScore =
    player.score - value;


  /* =================================================
     BUST :
     UNIQUEMENT SI LE SCORE PASSE SOUS 0
  ================================================= */

  if(
    newScore < 0
  ){

    bust();

    return;

  }


  player.score =
    newScore;


  let label;


  if(
    type === "Bullseye"
  ){

    label =
      "Bullseye 50";

  }
  else if(
    type === "Bull"
  ){

    label =
      "Bull 25";

  }
  else{

    label =
      type +
      " " +
      base;

  }


  state.darts.push({

    value:value,

    label:label

  });


  el("message")
    .textContent =

      `${label} → reste ${newScore}`;


  /* =================================================
     VICTOIRE À 0
  ================================================= */

  if(
    newScore === 0
  ){

    state.gameOver =
      true;


    const winner =
      player.name;


    const loser =
      state.players[
        state.active === 0
          ? 1
          : 0
      ].name;


    const victoryMessage =
      getVictoryMessage(
        winner,
        loser
      );


    state.history.push({

      player:
        player.name,

      text:
        `🎯 VICTOIRE — ${victoryMessage}`

    });


    render();


    el("winnerText")
      .innerHTML =
        victoryMessage;


    el("winModal")
      .classList
      .add("show");


    return;

  }


  /* =================================================
     3 FLÉCHETTES
  ================================================= */

  if(
    state.darts.length === 3
  ){

    endTurn(true);

    return;

  }


  render();

}


/* =====================================================
   MISS
===================================================== */

function addMiss(){

  if(
    state.gameOver
  ){
    return;
  }


  if(
    state.darts.length >= 3
  ){
    return;
  }


  state.darts.push({

    value:0,

    label:"MISS"

  });


  el("message")
    .textContent =
      "MISS → 0 point";


  if(
    state.darts.length === 3
  ){

    endTurn(true);

    return;

  }


  render();

}


/* =====================================================
   BUST
===================================================== */

function bust(){

  if(
    state.gameOver
  ){
    return;
  }


  const player =
    state.players[
      state.active
    ];


  player.score =
    state.turnStartScore;


  state.history.push({

    player:
      player.name,

    text:
      `BUST — retour à ${state.turnStartScore}`

  });


  state.darts=[];


  el("message")
    .textContent =

      `BUST ! Score restauré à ${player.score}`;


  switchPlayer();

}


/* =====================================================
   FIN DU TOUR
===================================================== */

function endTurn(auto=false){

  if(
    state.gameOver
  ){
    return;
  }


  const player =
    state.players[
      state.active
    ];


  if(
    state.darts.length === 0 &&
    !auto
  ){
    return;
  }


  const total =
    state.darts.reduce(
      function(sum,dart){

        return sum + dart.value;

      },
      0
    );


  state.history.push({

    player:
      player.name,

    text:
      `+${total} (${state.darts
        .map(
          dart =>
            dart.label
        )
        .join(", ")}) → ${player.score}`

  });


  state.darts=[];


  switchPlayer();

}


/* =====================================================
   CHANGER DE JOUEUR
===================================================== */

function switchPlayer(){

  state.active =

    (
      state.active + 1
    )
    %
    state.players.length;


  state.turnStartScore =

    state.players[
      state.active
    ].score;


  render();


  el("message")
    .textContent =

      `Tour de ${
        state.players[
          state.active
        ].name
      }`;

}


/* =====================================================
   ANNULER
===================================================== */

function undo(){

  if(
    state.gameOver
  ){
    return;
  }


  if(
    state.darts.length === 0
  ){
    return;
  }


  const dart =
    state.darts.pop();


  state.players[
    state.active
  ].score +=
    dart.value;


  el("message")
    .textContent =

      `Annulé : ${dart.label}`;


  render();

}


/* =====================================================
   FENÊTRE VICTOIRE
===================================================== */

function closeWin(){

  el("winModal")
    .classList
    .remove("show");

}


/* =====================================================
   INITIALISATION
===================================================== */

drawBoard();

newGame();

</script>
